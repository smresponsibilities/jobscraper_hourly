name: yc-daily

on:
  schedule:
    # Daily at 05:10 UTC. Runs independently of the weekly discover/bulk-import
    # chain so the common-crawl step does not block YC coverage. YC-stage
    # startups adopt an ATS after they start hiring, so the same list re-run
    # daily catches boards that resolved to nothing yesterday.
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  yc-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pull latest companies.json before detect runs so the commit at the end
      # is a fast-forward — the weekly discover/bulk-import run, bot commits,
      # and yesterday's yc-daily all move the ref.
      - run: git pull origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      # India only — same reasoning as the yc-directory job in discover.yml.
      - run: npm run yc-domains -- India > state/yc-india.txt

      - run: npm run detect -- state/yc-india.txt

      - name: Commit and push resolved boards with atomic retry
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies.json
          if ! git diff --cached --quiet; then
            git commit -m "yc: boards resolved from the YC India directory [skip ci]" || true
            for attempt in 1 2 3 4 5; do
              git fetch origin main && \
              (git rebase -X theirs --autostash origin/main || (git rebase --abort || true; git pull --no-rebase -X theirs origin main)) && \
              git push origin HEAD:main && break
              echo "Push attempt $attempt failed, retrying in 5s..."
              sleep 5
            done
          fi
          file_pattern: companies.json
