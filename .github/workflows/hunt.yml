name: hunt

on:
  schedule:
    # :17 rather than :00 — the top of the hour is when GitHub's scheduler queue
    # is most congested and runs get delayed the longest.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send a test email containing everything that currently matches'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # State lives in the Actions cache between runs, not in a commit. Committing
      # it hourly would add a full copy of the file to git history 24 times a day.
      # The committed snapshot below is the durable backup if a cache is evicted.
      - name: Restore seen state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - run: npm install --no-audit --no-fund

      # Only Google and Meta need a real browser; everything else is a JSON call.
      # The download is ~115 MB, so it's cached — otherwise it would dominate the
      # runtime of an otherwise six-minute job.
      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      # Non-fatal: only 5 of 381 boards need a browser, and the adapter returns
      # empty rather than throwing when Playwright is missing. A bad install
      # should never cost you the other 376.
      - name: Install Chromium
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - id: hunt
        run: npm run hunt
        env:
          TEST_EMAIL: ${{ inputs.test_email && '1' || '0' }}

      - name: Save seen state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/seen.json
          key: seen-${{ github.run_id }}

      - name: Email new roles
        if: steps.hunt.outputs.new_count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Job Alerts <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.ALERT_TO }}
          subject: '[jobs] ${{ steps.hunt.outputs.subject }}'
          html_body: file://out/email.html

      # data/jobs.json is what the web UI reads, so it commits every run — it's a
      # few hundred rows and compresses to a couple of KB. state/seen.json holds
      # ~15,000 IDs and only snapshots daily, since a full copy of it in git
      # history 24 times a day is what would actually bloat the repo.
      - name: Publish catalog
        if: '!inputs.test_email'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: ${{ steps.hunt.outputs.new_count }} new [skip ci]'
          file_pattern: >-
            ${{ steps.hunt.outputs.hour == '5'
                && 'data/jobs.json companies.json state/seen.json'
                || 'data/jobs.json companies.json' }}
