name: outreach

# The cold-email batch builder, deployed. Trigger with the green
# "Run workflow" button (or POST a workflow_dispatch) and the fresh batch page
# is committed to web/public/outreach/, where the Vercel site serves it. Card
# buttons point at /api/outreach/* routes which record state back into
# state/contacted.json via the GitHub Contents API — same bookkeeping the
# localhost server did, just hosted.
#
# Note: GitHub-hosted runners block outbound port 25, so SMTP verification
# degrades every address to `unknown` here (the gravatar positive-signal still
# runs). Run `npm run outreach` locally when you want real verdicts.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install

      # Pull the live click-state so follow-up scheduling and dedup continue
      # across builds (the file is untracked; the API routes commit it).
      - name: Restore contacted state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://api.github.com/repos/${{ github.repository }}/contents/state/contacted.json?ref=${{ github.ref_name }}"
          code=$(curl -s -o state/contacted.json -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" "$url")
          if [ "$code" != "200" ]; then echo "{}" > state/contacted.json; echo "no prior state, starting clean"; fi

      - name: Build batch
        env:
          OUTREACH_LINK_BASE: ${{ vars.OUTREACH_LINK_BASE || 'https://jobscraper-hourly.vercel.app/api' }}
        run: npm run outreach -- --static

      - name: Publish page + draft map
        run: |
          mkdir -p web/public/outreach
          cp out/outbox/today.html web/public/outreach/today.html
          cp out/outbox/batch.json web/public/outreach/batch.json

      - name: Commit page and click-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "outreach bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/outreach/
          git add -f state/contacted.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "outreach: refresh batch page [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
